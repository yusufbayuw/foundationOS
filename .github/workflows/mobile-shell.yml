name: Mobile Shell

on:
  pull_request:
    paths:
      - "mobile/**"
      - "public/manifest.webmanifest"
      - "public/sw.js"
      - ".github/workflows/mobile-shell.yml"

jobs:
  validate-mobile-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Capacitor metadata
        run: node -e "const fs=require('fs'); const cfg=JSON.parse(fs.readFileSync('mobile/capacitor.config.json','utf8')); if(!cfg.appId || !cfg.appName || !cfg.webDir) process.exit(1);"
      - name: Validate PWA manifest
        run: node -e "const fs=require('fs'); const manifest=JSON.parse(fs.readFileSync('public/manifest.webmanifest','utf8')); if(manifest.display !== 'standalone') process.exit(1);"
