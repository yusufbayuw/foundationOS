name: WebAuthn temporary lockfile bootstrap
on:
  push:
    branches:
      - agent/security-webauthn-standard-20261022
    paths:
      - .github/workflows/webauthn-lock-bootstrap.yml

permissions:
  contents: write

jobs:
  composer-lock:
    if: github.repository == 'yusufbayuw/foundationOS'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          tools: composer:v2
      - name: Resolve the pinned WebAuthn dependency
        run: composer update laravel/passkeys --with-all-dependencies --no-scripts --no-interaction --no-progress
      - name: Verify resolved dependency
        run: |
          composer validate --no-check-publish
          composer show laravel/passkeys --locked
          git diff --check
      - name: Commit lockfile to this isolated feature branch
        run: |
          git config user.name "foundationos-security-bot"
          git config user.email "foundationos-security-bot@users.noreply.github.com"
          git add composer.lock
          git diff --cached --quiet && exit 0
          git commit -m "build(webauthn): resolve first-party passkeys lockfile"
          git push origin HEAD:agent/security-webauthn-standard-20261022
