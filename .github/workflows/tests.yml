name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Show CI context
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Environment: SQLite testing"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pcov
          tools: composer:v2
          coverage: pcov
          ini-values: memory_limit=1G

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Show PHP and Composer versions
        run: |
          php --version
          composer --version

      - name: Ensure full test selection is identical with coverage enabled
        run: |
          php scripts/verify-phpunit-suite-parity.php phpunit.xml phpunit.coverage.xml
          # Negative fixture: the guard MUST detect a silently omitted Regression suite.
          sed 's#tests/Regression#tests/RegressionOMITTED#' phpunit.coverage.xml > "${RUNNER_TEMP}/phpunit.coverage-regression-omitted.xml"
          if php scripts/verify-phpunit-suite-parity.php phpunit.xml "${RUNNER_TEMP}/phpunit.coverage-regression-omitted.xml"; then
            echo "::error::PHPUnit parity guard failed to catch regression suite omission"
            exit 1
          fi

      - name: Prove a failing regression test is not silently skipped
        run: |
          cat > tests/Regression/CIIntentionallyFailingRegressionTest.php <<'PHP'
          <?php

          use PHPUnit\Framework\TestCase;

          final class CIIntentionallyFailingRegressionTest extends TestCase
          {
              public function test_a_regression_must_fail_the_gate(): void
              {
                  self::assertSame('expected', 'intentional-regression');
              }
          }
          PHP
          if php vendor/bin/phpunit -c phpunit.coverage.xml --no-coverage --filter CIIntentionallyFailingRegressionTest --colors=never > "${RUNNER_TEMP}/expected-regression-failure.log" 2>&1; then
            echo "::error::Intentional failing regression test returned a passing status"
            exit 1
          fi
          if ! grep -Fq 'CIIntentionallyFailingRegressionTest' "${RUNNER_TEMP}/expected-regression-failure.log" ||
             ! grep -Fq 'Failed asserting' "${RUNNER_TEMP}/expected-regression-failure.log"; then
            echo "::error::The test command failed for an unexpected reason"
            tail -n 30 "${RUNNER_TEMP}/expected-regression-failure.log"
            exit 1
          fi
          rm tests/Regression/CIIntentionallyFailingRegressionTest.php
          echo "Intentional negative regression fixture was detected and removed."

      - name: Run complete tests with scoped coverage (one PHPUnit execution)
        run: |
          mkdir -p coverage
          php -d pcov.directory="${GITHUB_WORKSPACE}" vendor/bin/phpunit -c phpunit.coverage.xml --coverage-clover=coverage/clover.xml --colors=never

      - name: Upload complete suite coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-clover
          path: coverage/clover.xml
          if-no-files-found: error
          retention-days: 7

  coverage:
    # Keep this required check name unchanged. Coverage is calculated by the
    # full PHPUnit job, and independently threshold-validated here.
    name: Coverage (80% minimum)
    runs-on: ubuntu-latest
    needs: phpunit
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4 for coverage gate
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, libxml, xml
          coverage: none

      - name: Download complete suite coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-clover
          path: coverage

      - name: Enforce unchanged 80% coverage threshold
        run: php scripts/check-coverage-threshold.php coverage/clover.xml 80

  suites:
    name: Named suites smoke
    runs-on: ubuntu-latest
    needs: phpunit
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        suite:
          - Unit
          - Feature
          - Workflow
          - Tenant
          - Policy
          - Permission
          - Regression
          - Queue
          - ParallelWorkflow
          - ImportExport

    steps:
      - uses: actions/checkout@v4

      - name: Show CI context
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Environment: SQLite named suite (${{ matrix.suite }})"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=1G

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Show PHP and Composer versions
        run: |
          php --version
          composer --version

      - name: Run ${{ matrix.suite }} suite
        run: php artisan test --compact --testsuite=${{ matrix.suite }}

  postgresql:
    name: PostgreSQL integration and migration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: foundationos_testing
          POSTGRES_USER: foundationos
          POSTGRES_PASSWORD: foundationos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foundationos -d foundationos_testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      BCRYPT_ROUNDS: 4
      CACHE_STORE: array
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: foundationos_testing
      DB_USERNAME: foundationos
      DB_PASSWORD: foundationos
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      PULSE_ENABLED: false
      TELESCOPE_ENABLED: false
      NIGHTWATCH_ENABLED: false

    steps:
      - uses: actions/checkout@v4

      - name: Show CI context
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Environment: PostgreSQL integration testing"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, pgsql
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=1G

      - name: Generate ephemeral Laravel APP_KEY for this CI job
        shell: bash
        run: |
          key="$(php -r 'echo "base64:".base64_encode(random_bytes(32));')"
          echo "::add-mask::$key"
          printf 'APP_KEY=%s\n' "$key" >> "$GITHUB_ENV"

      - name: Get Composer cache directory
        id: composer-cache-postgresql
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache-postgresql.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Show PHP and Composer versions
        run: |
          php --version
          composer --version

      - name: Migrate empty PostgreSQL database
        run: |
          php artisan migrate:fresh --force
          php artisan db:show --database=pgsql

      - name: Run PostgreSQL priority suites
        run: |
          php artisan test --compact --testsuite=Tenant
          php artisan test --compact --testsuite=Feature
          php artisan test --compact --testsuite=Workflow
          php artisan test --compact --testsuite=Queue
          php artisan test --compact --testsuite=Regression
          php artisan test --compact --testsuite=ImportExport


  mariadb-migrations:
    # One disposable MariaDB schema smoke; no duplicate 8k-test suite.
    name: MariaDB migration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-only-root
          MARIADB_DATABASE: foundationos_migration_ci
          MARIADB_USER: foundationos
          MARIADB_PASSWORD: ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      APP_ENV: testing
      BCRYPT_ROUNDS: 4
      CACHE_STORE: array
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: foundationos_migration_ci
      DB_USERNAME: foundationos
      DB_PASSWORD: ci-only-password
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      PULSE_ENABLED: false
      TELESCOPE_ENABLED: false
      NIGHTWATCH_ENABLED: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4 and MariaDB driver
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, mysqli
          tools: composer:v2
          coverage: none

      - name: Generate ephemeral Laravel APP_KEY for this CI job
        shell: bash
        run: |
          key="$(php -r 'echo "base64:".base64_encode(random_bytes(32));')"
          echo "::add-mask::$key"
          printf 'APP_KEY=%s\n' "$key" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit all migration identifiers before opening the database
        run: php vendor/bin/phpunit tests/Unit/MigrationIdentifierLengthTest.php --no-coverage --colors=never

      - name: Fresh migration on disposable CI database only
        run: |
          test "$APP_ENV" = "testing"
          test "$DB_DATABASE" = "foundationos_migration_ci"
          php artisan migrate:fresh --force --no-interaction
          php artisan migrate:status --no-interaction
