name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, agent/devops-ci-duplicate-suite-removal-20261025]
    # Temporary stacked-PR test target; remove second branch before landing on main.
    # A draft gets fast feedback; making it ready automatically triggers
    # the complete test / coverage / database integration gates.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: CI risk classification (fail closed)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.classify.outputs.full || steps.nonpr.outputs.full }}
      targets: ${{ steps.classify.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP for scope classification
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Main push, nightly and dispatch always run full regression
        id: nonpr
        if: ${{ github.event_name != 'pull_request' }}
        run: echo "full=true" >> "$GITHUB_OUTPUT"

      - name: Classify exact PR base/head diff
        id: classify
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          php scripts/ci/test-classify-ci-scope.php
          git rev-parse --verify "${BASE_SHA}^{commit}"
          git rev-parse --verify "${HEAD_SHA}^{commit}"
          git diff --name-only -z "${BASE_SHA}" "${HEAD_SHA}" > "$RUNNER_TEMP/changed-files.nul"
          php scripts/ci/classify-ci-scope.php "$RUNNER_TEMP/changed-files.nul" >> "$GITHUB_OUTPUT"

  fast-smoke:
    name: Fast PHP smoke (draft/low-risk PR)
    needs: scope
    if: ${{ github.event_name == 'pull_request' && (github.event.pull_request.draft || needs.scope.outputs.full == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=1G

      - name: Get Composer cache directory
        id: composer-cache-fast
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache-fast.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare disposable CI application
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Fail closed on missing or divergent PHPUnit suites
        run: php scripts/verify-phpunit-suite-parity.php phpunit.xml phpunit.coverage.xml

      - name: Quick security, tenant, and regression feedback
        run: |
          php artisan test --compact --testsuite=Unit
          php artisan test --compact --testsuite=Tenant
          php artisan test --compact --testsuite=Policy
          php artisan test --compact --testsuite=Permission
          php artisan test --compact --testsuite=Queue
          php artisan test --compact --testsuite=Regression

      - name: Run explicitly mapped low-risk feature tests
        if: ${{ !github.event.pull_request.draft && needs.scope.outputs.full == 'false' }}
        env:
          TARGETS: ${{ needs.scope.outputs.targets }}
        run: |
          set -euo pipefail
          for file in $TARGETS; do
            test -f "$file"
            php artisan test --compact "$file"
          done

  phpunit:
    # All 7,897 tests and coverage run on main/nightly/dispatch and high-risk
    # ready PRs. Unknown changes default to this full regression gate.
    needs: scope
    if: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.scope.outputs.full == 'true') }}
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Show CI context
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Environment: SQLite testing"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pcov
          tools: composer:v2
          coverage: pcov
          ini-values: memory_limit=1G

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Show PHP and Composer versions
        run: |
          php --version
          composer --version

      - name: Ensure full test selection is identical with coverage enabled
        run: |
          php scripts/verify-phpunit-suite-parity.php phpunit.xml phpunit.coverage.xml
          # Negative fixture: the guard MUST detect a silently omitted Regression suite.
          sed 's#tests/Regression#tests/RegressionOMITTED#' phpunit.coverage.xml > "${RUNNER_TEMP}/phpunit.coverage-regression-omitted.xml"
          if php scripts/verify-phpunit-suite-parity.php phpunit.xml "${RUNNER_TEMP}/phpunit.coverage-regression-omitted.xml"; then
            echo "::error::PHPUnit parity guard failed to catch regression suite omission"
            exit 1
          fi

          # Removing the same suite from BOTH configs must still fail:
          # parity alone cannot catch a coordinated omission.
          sed '/<testsuite name="Regression">/,/<.testsuite>/d' phpunit.xml > "${RUNNER_TEMP}/phpunit.no-regression.xml"
          sed '/<testsuite name="Regression">/,/<.testsuite>/d' phpunit.coverage.xml > "${RUNNER_TEMP}/phpunit.coverage.no-regression.xml"
          if php scripts/verify-phpunit-suite-parity.php "${RUNNER_TEMP}/phpunit.no-regression.xml" "${RUNNER_TEMP}/phpunit.coverage.no-regression.xml"; then
            echo "::error::Required-suite guard allowed Regression to be deleted from both configs"
            exit 1
          fi

      - name: Prove a failing regression test is not silently skipped
        run: |
          cat > tests/Regression/CIIntentionallyFailingRegressionTest.php <<'PHP'
          <?php

          use PHPUnit\Framework\TestCase;

          final class CIIntentionallyFailingRegressionTest extends TestCase
          {
              public function test_a_regression_must_fail_the_gate(): void
              {
                  self::assertSame('expected', 'intentional-regression');
              }
          }
          PHP
          if php vendor/bin/phpunit -c phpunit.coverage.xml --no-coverage --filter CIIntentionallyFailingRegressionTest --colors=never > "${RUNNER_TEMP}/expected-regression-failure.log" 2>&1; then
            echo "::error::Intentional failing regression test returned a passing status"
            exit 1
          fi
          if ! grep -Fq 'CIIntentionallyFailingRegressionTest' "${RUNNER_TEMP}/expected-regression-failure.log" ||
             ! grep -Fq 'Failed asserting' "${RUNNER_TEMP}/expected-regression-failure.log"; then
            echo "::error::The test command failed for an unexpected reason"
            tail -n 30 "${RUNNER_TEMP}/expected-regression-failure.log"
            exit 1
          fi
          rm tests/Regression/CIIntentionallyFailingRegressionTest.php
          echo "Intentional negative regression fixture was detected and removed."

      - name: Run complete tests with scoped coverage (one PHPUnit execution)
        run: |
          mkdir -p coverage
          php -d pcov.directory="${GITHUB_WORKSPACE}" vendor/bin/phpunit -c phpunit.coverage.xml --coverage-clover=coverage/clover.xml --colors=never

      - name: Upload complete suite coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-clover
          path: coverage/clover.xml
          if-no-files-found: error
          retention-days: 7

  coverage:
    # Keep this required check name unchanged. Coverage is calculated by the
    # full PHPUnit job, and independently threshold-validated here.
    name: Coverage (80% minimum)
    runs-on: ubuntu-latest
    needs: phpunit
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4 for coverage gate
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, libxml, xml
          coverage: none

      - name: Download complete suite coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-clover
          path: coverage

      - name: Enforce unchanged 80% coverage threshold
        run: php scripts/check-coverage-threshold.php coverage/clover.xml 80

  # Named suites smoke used to rerun all ten PHP suites AFTER the complete
  # PHPUnit coverage run. The parity/required-suite and intentional-failure
  # guards below preserve test discovery and failure detection without that
  # expensive duplicate matrix. See Issue #115.


  postgresql:
    needs: scope
    if: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.scope.outputs.full == 'true') }}
    name: PostgreSQL integration and migration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: foundationos_testing
          POSTGRES_USER: foundationos
          POSTGRES_PASSWORD: foundationos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foundationos -d foundationos_testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      BCRYPT_ROUNDS: 4
      CACHE_STORE: array
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: foundationos_testing
      DB_USERNAME: foundationos
      DB_PASSWORD: foundationos
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      PULSE_ENABLED: false
      TELESCOPE_ENABLED: false
      NIGHTWATCH_ENABLED: false

    steps:
      - uses: actions/checkout@v4

      - name: Show CI context
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Environment: PostgreSQL integration testing"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, pgsql
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=1G

      - name: Generate ephemeral Laravel APP_KEY for this CI job
        shell: bash
        run: |
          key="$(php -r 'echo "base64:".base64_encode(random_bytes(32));')"
          echo "::add-mask::$key"
          printf 'APP_KEY=%s\n' "$key" >> "$GITHUB_ENV"

      - name: Get Composer cache directory
        id: composer-cache-postgresql
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache-postgresql.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Show PHP and Composer versions
        run: |
          php --version
          composer --version

      - name: Migrate empty PostgreSQL database
        run: |
          php artisan migrate:fresh --force
          php artisan db:show --database=pgsql

      - name: Run PostgreSQL priority suites
        run: |
          php artisan test --compact --testsuite=Tenant
          php artisan test --compact --testsuite=Feature
          php artisan test --compact --testsuite=Workflow
          php artisan test --compact --testsuite=Queue
          php artisan test --compact --testsuite=Regression
          php artisan test --compact --testsuite=ImportExport


  mariadb-migrations:
    needs: scope
    if: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.scope.outputs.full == 'true') }}
    # One disposable MariaDB schema smoke; no duplicate 8k-test suite.
    name: MariaDB migration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-only-root
          MARIADB_DATABASE: foundationos_migration_ci
          MARIADB_USER: foundationos
          MARIADB_PASSWORD: ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      APP_ENV: testing
      BCRYPT_ROUNDS: 4
      CACHE_STORE: array
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: foundationos_migration_ci
      DB_USERNAME: foundationos
      DB_PASSWORD: ci-only-password
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      PULSE_ENABLED: false
      TELESCOPE_ENABLED: false
      NIGHTWATCH_ENABLED: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4 and MariaDB driver
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, mysqli
          tools: composer:v2
          coverage: none

      - name: Generate ephemeral Laravel APP_KEY for this CI job
        shell: bash
        run: |
          key="$(php -r 'echo "base64:".base64_encode(random_bytes(32));')"
          echo "::add-mask::$key"
          printf 'APP_KEY=%s\n' "$key" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit all migration identifiers before opening the database
        run: php vendor/bin/phpunit tests/Unit/MigrationIdentifierLengthTest.php --no-coverage --colors=never

      - name: Fresh migration on disposable CI database only
        run: |
          test "$APP_ENV" = "testing"
          test "$DB_DATABASE" = "foundationos_migration_ci"
          php artisan migrate:fresh --force --no-interaction
          php artisan migrate:status --no-interaction

  integration-gate:
    name: CI integration gate (risk-aware)
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [scope, fast-smoke, phpunit, coverage, postgresql, mariadb-migrations]
    timeout-minutes: 3
    env:
      SCOPE_STATUS: ${{ needs.scope.result }}
      FULL: ${{ needs.scope.outputs.full }}
      EVENT: ${{ github.event_name }}
      DRAFT: ${{ github.event.pull_request.draft }}
      FAST_STATUS: ${{ needs.fast-smoke.result }}
      PHPUNIT_STATUS: ${{ needs.phpunit.result }}
      COVERAGE_STATUS: ${{ needs.coverage.result }}
      PG_STATUS: ${{ needs.postgresql.result }}
      MARIADB_STATUS: ${{ needs.mariadb-migrations.result }}
    steps:
      - name: Reject missing classification or incomplete required test tier
        run: |
          set -euo pipefail
          test "$SCOPE_STATUS" = success
          case "$FULL" in true|false) ;; *) echo "::error::No valid CI scope"; exit 1 ;; esac
          if [ "$EVENT" != pull_request ] || { [ "$FULL" = true ] && [ "$DRAFT" != true ]; }; then
            for result in "$PHPUNIT_STATUS" "$COVERAGE_STATUS" "$PG_STATUS" "$MARIADB_STATUS"; do
              if [ "$result" != success ]; then
                echo "::error::Mandatory full regression or database verification did not pass"
                exit 1
              fi
            done
            echo "Full regression, 80% coverage, PostgreSQL and MariaDB passed."
          else
            test "$FAST_STATUS" = success || {
              echo "::error::Mandatory fast and module-mapped tests did not pass"
              exit 1
            }
            echo "Fast feedback passed; full integration evidence is required for high-risk/release."
          fi
