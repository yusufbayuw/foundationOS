name: Temporary CI Remediation

on:
  push:
    branches: [fix/postgres-tenant-ci-20261010]

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP tooling
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Normalize changed PHP files
        run: |
          vendor/bin/pint Modules/Core/app/Services/TenantSetupProgress.php Modules/Core/app/Models/Tenant.php Modules/School/app/Models/Student.php database/migrations/2026_03_25_162905_create_notifications_table.php database/migrations/2026_10_10_000000_normalize_pgsql_notifications_data_to_jsonb.php tests/Regression/DatabaseNotificationJsonQueryTest.php

      - name: Repair locked npm vulnerabilities
        run: npm audit fix --package-lock-only --no-fund

      - name: Verify dependency security
        run: npm audit --package-lock-only --audit-level=high

      - name: Commit remediations to this temporary branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Modules/Core/app/Services/TenantSetupProgress.php Modules/Core/app/Models/Tenant.php Modules/School/app/Models/Student.php database/migrations/2026_03_25_162905_create_notifications_table.php database/migrations/2026_10_10_000000_normalize_pgsql_notifications_data_to_jsonb.php tests/Regression/DatabaseNotificationJsonQueryTest.php package-lock.json package.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix: format changes and patch vulnerable npm dependencies'
            git push origin HEAD:fix/postgres-tenant-ci-20261010
          fi
