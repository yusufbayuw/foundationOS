name: Quality and Supply Chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  composer-validation:
    name: Composer validation and autoload
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Show CI context
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Environment: CI repository validation"
          php --version
          composer --version

      - name: Validate Composer manifest and lock file
        run: composer validate --strict

      - name: Validate optimized PSR-4 autoload generation
        run: composer dump-autoload --optimize --strict-psr --no-scripts

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Show CI context
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Environment: CI frontend build"
          node --version
          npm --version

      - name: Install PHP dependencies required by the Filament theme
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

  dependency-security:
    name: Dependency security (High and Critical)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Show CI context
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Environment: CI dependency security"
          php --version
          composer --version
          node --version
          npm --version

      - name: Audit Composer dependencies
        run: composer audit --locked --ignore-severity=low --ignore-severity=medium

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject static APP_KEY across workflows and test configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          workflows = list(Path('.github/workflows').glob('*.yml'))
          workflows += list(Path('.github/workflows').glob('*.yaml'))
          leaked = any(
              re.search(r'(?m)^\s*APP_KEY\s*:\s*\S+', path.read_text(encoding='utf-8'))
              for path in workflows
          )
          # PHPUnit config files previously repeated the same public CI key.
          # Only detect presence: NEVER emit file contents or partial secrets.
          phpunit_files = list(Path('.').glob('phpunit*.xml'))
          leaked_phpunit = any(
              re.search(r'<env\\s+name=[\\x22\\x27]APP_KEY[\\x22\\x27]\\s+value=[\\x22\\x27](?![\\x22\\x27])[^\\x22\\x27]+', path.read_text(encoding='utf-8'))
              for path in phpunit_files
          )
          leaked_dotenv = any(
              re.search(r'(?m)^APP_KEY=(?!\\s*$)\\S+', path.read_text(encoding='utf-8'))
              for path in Path('.').glob('.env*') if path.is_file()
          )
          if leaked or leaked_phpunit or leaked_dotenv:
              print('::error::A tracked test/CI configuration contains a non-empty static APP_KEY. Use per-job generated keys.')
              sys.exit(1)
          PY

      - name: Show CI context
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Environment: CI secret scan"

      - name: Scan repository history and changes for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check Dependency Graph availability
        id: dependency-graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" --silent >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Dependency Graph is not available. Enable it under Settings > Security > Code security and analysis. Composer and npm audit remain mandatory."
          fi

      - name: Review dependency changes
        if: steps.dependency-graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-1.0, AGPL-3.0
