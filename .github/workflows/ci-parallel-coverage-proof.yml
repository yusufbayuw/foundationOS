name: Parallel PHPUnit Proof (non-gating)

on:
  pull_request:
    branches: [agent/devops-ci-duplicate-suite-removal-20261025]
    paths:
      - 'scripts/ci/**'
      - '.github/workflows/ci-parallel-coverage-proof.yml'

permissions:
  contents: read

concurrency:
  group: phpunit-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shard:
    name: Proof shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, simplexml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pcov
          tools: composer:v2
          coverage: pcov
          ini-values: memory_limit=2G
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prepare disposable CI runtime
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
      - name: Verify isolated workflow resolver can autoload
        run: |
          php -l tests/ParallelWorkflow/InlineMultiUserResolver.php
          php -l tests/ParallelWorkflow/WorkflowParallelGatewayTest.php
          php -l tests/ParallelWorkflow/WorkflowParallelJoinTest.php
          php -r 'require "vendor/autoload.php"; exit(class_exists("Tests\\ParallelWorkflow\\InlineMultiUserResolver") ? 0 : 1);'
      - name: Build deterministic shard
        run: |
          php scripts/verify-phpunit-suite-parity.php phpunit.xml phpunit.coverage.xml
          php scripts/ci/phpunit-shard.php 4 ${{ matrix.shard }}
      - name: PHPUnit shard with native coverage
        run: |
          mkdir -p coverage
          php -d pcov.directory="${GITHUB_WORKSPACE}" vendor/bin/phpunit -c phpunit-shard-${{ matrix.shard }}.xml --coverage-php coverage/shard-${{ matrix.shard }}.cov --colors=never
      - uses: actions/upload-artifact@v4
        with:
          name: proof-shard-${{ matrix.shard }}
          path: |
            coverage/shard-${{ matrix.shard }}.cov
            phpunit-shard-manifest.json
          if-no-files-found: error
          retention-days: 3

  baseline:
    name: Proof monolithic baseline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, simplexml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pcov
          tools: composer:v2
          coverage: pcov
          ini-values: memory_limit=1G
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prepare disposable CI runtime
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
      - name: Unchanged full PHPUnit coverage
        run: |
          mkdir -p coverage
          php -d pcov.directory="${GITHUB_WORKSPACE}" vendor/bin/phpunit -c phpunit.coverage.xml --coverage-clover=coverage/monolithic.xml --colors=never
      - uses: actions/upload-artifact@v4
        with:
          name: proof-baseline
          path: coverage/monolithic.xml
          if-no-files-found: error
          retention-days: 3

  compare:
    name: Prove exact coverage parity (non-gating)
    runs-on: ubuntu-latest
    needs: [shard, baseline]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, libxml, simplexml, xml
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=2G
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - run: composer install --no-interaction --no-progress --prefer-dist
      - uses: actions/download-artifact@v4
        with:
          pattern: proof-*
          path: proof
      - name: Verify all four results use identical file manifest
        run: |
          set -euo pipefail
          for n in 0 1 2 3; do
            test -s "proof/proof-shard-$n/phpunit-shard-manifest.json"
            test -s "proof/proof-shard-$n/coverage/shard-$n.cov"
          done
          test -s proof/proof-baseline/coverage/monolithic.xml
          for n in 1 2 3; do
            cmp proof/proof-shard-0/phpunit-shard-manifest.json "proof/proof-shard-$n/phpunit-shard-manifest.json"
          done
      - name: Merge and require monolithic equivalence and 80% threshold
        run: |
          mkdir -p coverage
          php scripts/ci/merge-phpunit-coverage.php coverage/merged.xml proof/proof-baseline/coverage/monolithic.xml proof/proof-shard-0/coverage/shard-0.cov proof/proof-shard-1/coverage/shard-1.cov proof/proof-shard-2/coverage/shard-2.cov proof/proof-shard-3/coverage/shard-3.cov
          php scripts/check-coverage-threshold.php coverage/merged.xml 80
