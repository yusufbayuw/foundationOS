name: Static Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pint:
    name: Laravel Pint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Show CI context
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Environment: CI"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=1G

      - name: Show PHP and Composer versions
        run: |
          php --version
          composer --version

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run Pint
        run: vendor/bin/pint --test

      # TEMPORARY PR-only diagnostics: inspect Pint's exact suggested edits.
      - name: Print Pint corrections for migration fix review
        if: failure()
        run: |
          vendor/bin/pint
          git diff -- database/migrations/2026_03_26_090000_create_moodle_learning_metrics_table.php Modules/Workflow/database/migrations/2026_03_26_210500_create_workflow_assignments_table.php Modules/Workflow/database/migrations/2026_03_27_120000_create_workflow_automated_actions_table.php Modules/Exam/database/migrations/2026_05_28_130000_expand_exam_participants_for_b5.php Modules/Exam/database/migrations/2026_05_29_180000_create_exam_gradebook_export_logs_table.php tests/Unit/MigrationIdentifierLengthTest.php


  phpstan:
    name: Larastan (level 1 + baseline, all GA modules)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show CI context
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Environment: CI"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=2G

      - name: Show PHP and Composer versions
        run: |
          php --version
          composer --version

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=2G

  phpstan-api-resources:
    name: Larastan API resources (level 1, no baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Show CI context
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Environment: CI"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=1G

      - name: Show PHP and Composer versions
        run: |
          php --version
          composer --version

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPStan on API resources
        run: vendor/bin/phpstan analyse --configuration=phpstan-app.neon --memory-limit=512M
