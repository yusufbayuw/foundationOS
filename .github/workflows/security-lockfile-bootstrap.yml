name: Security Lockfile Bootstrap (temporary)

on:
  push:
    branches:
      - agent/security-laravel-tokenguard-20261025
    paths:
      - .github/workflows/security-lockfile-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: security-lock-bootstrap-20261025
  cancel-in-progress: false

jobs:
  update-lock:
    if: github.repository == 'yusufbayuw/foundationOS'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Update only vulnerable Laravel and necessary transitive packages
        run: composer update "laravel/framework:13.29.0" --with-all-dependencies --minimal-changes --no-scripts --no-interaction --no-progress

      - name: Verify locked Laravel security patch and mandatory audit
        run: |
          composer show laravel/framework --locked
          composer validate --strict
          composer audit --locked --ignore-severity=low --ignore-severity=medium
          git diff --check

      - name: Commit lockfile only to isolated branch
        run: |
          git config user.name "foundationos-security-bot"
          git config user.email "foundationos-security-bot@users.noreply.github.com"
          git add composer.lock
          if git diff --cached --quiet; then
            echo "::error::Lockfile has not changed; refusing to claim a security upgrade"
            exit 1
          fi
          git commit -m "build(security): lock Laravel TokenGuard patch at 13.29.0"
          git push origin HEAD:agent/security-laravel-tokenguard-20261025
